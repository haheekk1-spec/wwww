<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>출그닝 · 온라인 사무실</title>
<style>
  :root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); color-scheme: dark; }
  html, body { min-height: 100%; margin: 0; }
  body { background: #1f1a1a; color: #eee; display: flex; flex-direction: column; align-items: center;
         padding: 16px 16px 28px; gap: 12px; font-family: -apple-system, "Noto Sans KR", sans-serif; }
  h1 { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 600; margin: 0; color: #f0d6d6; letter-spacing: 1px; }
  .logo { width: 34px; height: 34px; border-radius: 9px; background: #e5383b; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 800; }
  #status { font-size: 13px; color: #b09a9a; }
  #timer { font-size: 28px; font-variant-numeric: tabular-nums; letter-spacing: 1px; min-height: 34px; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 16px; width: 100%; max-width: 340px; box-sizing: border-box; background: #261e1e; border-radius: 14px; padding: 10px 16px; }
  .row2 { display: flex; gap: 8px; }
  #deco { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; }
  #deco[hidden] { display: none; }
  body > * { order: 5; }
  body > h1 { order: 0; }
  body > .top { order: 1; }
  body > #rooms { order: 2; }
  body > div:has(#seats) { order: 3; width: 100%; max-width: 720px; }
  body > #note { order: 9; }
  button { font-size: 15px; padding: 12px 24px; border: 0; border-radius: 999px; background: #e5383b; color: #fff; font-weight: 600; cursor: pointer; }
  button.out { background: #3d2f2f; color: #eee; }
  input { font-size: 14px; padding: 8px 14px; border-radius: 999px; border: 1px solid #4a3a3a; background: #2a2121; color: #eee; width: 120px; text-align: center; }
  .seats { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); column-gap:clamp(12px,4vw,38px); row-gap:25px; justify-items:stretch; max-width:760px; margin:auto; padding:16px 10px 25px; background:repeating-linear-gradient(0deg,#343138 0,#343138 5px,#39363b 5px,#39363b 60px); border-radius:12px; }
  .seats.cols3 { grid-template-columns:repeat(3,minmax(0,1fr)); max-width:760px; }
  .seats .cell { width:100%; min-width:0; }
  .seats .seat { width:100%; height:116px; border-radius:5px; background:#493b37; border:3px solid #8c7d7a; border-bottom:9px solid #8a6550; }
  .seat.empty { opacity:.58; border-style:dashed; cursor:pointer; }
  .seat.empty .mon { background:#201818; box-shadow:none; }
  .seat.empty .lbl { background:#403535; color:#bbaaaa; }
  .seat.boss { border-color:#d8a74b; background:#352a21; box-shadow:0 0 0 2px #6d502b; }
  .seat.boss .lbl { background:#c49a4a; color:#241b11; border-bottom-color:#85642d; }
  .seat.boss .mon { font-size:25px; }
  .seat.npc { border-color:#71526b; }
  .seat.npc .lbl { background:#795c78; color:white; border-bottom-color:#4f364e; }
  .seat.npc .mon { border-radius:6px; }
  .seat:focus-visible { outline:2px solid #fff; }
  @media(max-width:410px){ .seats {gap:5px;} .seat .lbl{left:3px;right:3px;font-size:11px;} .seat .shelf{font-size:17px;} }

  .seat { zoom: 1; position: relative; width: 96px; height: 120px; box-sizing: border-box; background: #261e1e; border: 3px solid #4a3a3a; border-bottom: 0; border-radius: 8px 8px 0 0; color: #7d6d6d; font-size: 13px; text-align: center; }
  .seat::after { content: ""; position: absolute; left: -3px; right: -3px; bottom: 0; height: 16px; background: #5a4343; border-radius: 3px 3px 0 0; }
  .seat .lbl { position: absolute; top: 6px; left: 10px; right: 10px; height: 20px; line-height: 20px; box-sizing: border-box; background: #6b604a; color: #cfc3a3; border-bottom: 3px solid #4d4434; border-radius: 3px; font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .seat .lbl.two { height: 32px; line-height: 14px; padding-top: 2px; }
  .seat .ttl { font-size: 11px; font-weight: 400; line-height: 11px; }
  button.swatch { width: 30px; height: 30px; padding: 0; border-radius: 50%; border: 2px solid transparent; }
  button.swatch.sel { border-color: #fff; }
  .seat.on .lbl, .seat.me .lbl { background: #e2cf9d; color: #2a2121; border-bottom-color: #a8956a; }
  .seat .shelf { position: absolute; bottom: 12px; left: 0; right: 0; display: flex; justify-content: center; gap: 1px; font-size: 21px; line-height: 23px; z-index: 1; }
  .seat .mon { position: absolute; left: 50%; bottom: 34px; width: 46px; height: 30px; margin-left: -23px; box-sizing: border-box; border-radius: 3px; background: #151010; border: 2px solid #5a4848; }
  .seat .stand { position: absolute; left: 50%; bottom: 16px; width: 10px; height: 18px; margin-left: -5px; background: #5a4848; }
  .seat.on { color: #e8c9c9; }
  .seat.on .mon { background: #9b2226; box-shadow: 0 0 10px #9b2226; }
  .seat.me { color: #fff; font-weight: 700; }
  .seat.me .mon { background: #e5383b; box-shadow: 0 0 12px #e5383b; }
  small { color: #8b7f7f; text-align: center; line-height: 1.5; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 340px; }
  button.chip { font-size: 14px; padding: 8px 14px; background: #2a2121; color: #ddd; border: 1px solid #4a3a3a; font-weight: 400; }
  button.chip.sel { background: #9b2226; border-color: #e5383b; color: #fff; }
  .seat .mon { text-align: center; font-size: 23px; line-height: 26px; }
  .seat.pause .mon { background: #3a2a2a; box-shadow: none; }
  .cell { width: 112px; }
  .cap { height: 19px; line-height: 19px; font-size: 12px; text-align: center; color: #d9b8b8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cap2 { color: #f2d49b; }
  .seat .prop { position: absolute; bottom: 12px; font-size: 15px; line-height: 1; z-index: 1; }
  .seat .pl { left: 5px; }
  .seat .pr { right: 5px; }
  .seats .cell:nth-child(3n+2){border-left:3px dashed #7b7370;border-right:3px dashed #7b7370;padding:0 4px;box-sizing:border-box}
  .seat .avatar{position:absolute;left:50%;top:29px;transform:translateX(-50%);font-size:28px;z-index:3;filter:drop-shadow(0 2px 2px #241d1d);pointer-events:none;line-height:1}
  .seat .avatar .arms{position:absolute;top:14px;left:-8px;font-size:13px;letter-spacing:20px;opacity:0}
  .seat .avatar.cheer{animation:cheer .55s ease-in-out 4}
  .seat .avatar.cheer .arms{opacity:1}
  .seat .avatar.sleep{animation:sleep 1.6s ease-in-out infinite;transform-origin:bottom center}
  .seat .avatar.coffee{animation:coffee 1.5s ease-in-out infinite}
  .seat .avatar.work{animation:work 0.35s ease-in-out infinite alternate}
  .seat .avatar.dance{animation:dance .55s ease-in-out infinite}
  .seat .avatar.panic{animation:panic .24s ease-in-out infinite}
  .seat .mon{z-index:4;bottom:28px;transform:scale(.78);transform-origin:bottom center}
  .seat .stand{z-index:4}
  .seat .lbl{z-index:5}
  .seat .shelf{z-index:5}
  .seat::before{content:'';position:absolute;top:-7px;left:-4px;right:-4px;border-top:5px solid #9b8984}
  .seat .speech{position:absolute;z-index:8;left:50%;top:-33px;transform:translateX(-50%);background:#fff6de;color:#40302c;border-radius:11px;padding:4px 7px;white-space:nowrap;max-width:145px;overflow:hidden;text-overflow:ellipsis;font-size:10px;box-shadow:0 2px 6px #0007}
  .seat.boss .avatar{cursor:pointer;pointer-events:auto}
  .seat.empty{opacity:.8}
  .seat.empty .avatar{display:none}
  .action-menu{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px auto 16px;max-width:520px}
  .action-menu button{padding:9px 11px;font-size:12px;border-radius:12px;background:#453536}
  .action-menu button.sel{background:#b54a55}
  .office-head{display:flex;align-items:center;justify-content:center;gap:12px;margin:12px auto;font-size:13px;color:#dbc8bb}
  .boss-modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:30;padding:18px}
  .boss-modal[hidden]{display:none}
  .boss-box{width:min(350px,100%);padding:22px;background:#30262c;border:1px solid #c49a4a;border-radius:20px;text-align:center;box-sizing:border-box}
  .boss-box input{width:90%;box-sizing:border-box;margin:12px auto}
  @keyframes cheer{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-12px) rotate(-8deg)}}
  @keyframes sleep{0%,100%{transform:translateX(-50%) rotate(0)}50%{transform:translateX(-50%) rotate(18deg) translateY(5px)}}
  @keyframes coffee{0%,100%{transform:translateX(-50%) rotate(0)}50%{transform:translateX(-50%) rotate(-12deg)}}
  @keyframes work{from{transform:translateX(-50%) translateY(0)}to{transform:translateX(-50%) translateY(2px)}}
  @keyframes dance{0%,100%{transform:translateX(-50%) rotate(-14deg)}50%{transform:translateX(-50%) rotate(14deg) translateY(-5px)}}
  @keyframes panic{0%,100%{transform:translateX(-50%) translateX(-2px)}50%{transform:translateX(-50%) translateX(2px)}}
  @media(prefers-reduced-motion:reduce){.seat .avatar{animation:none!important}}
</style>
</head>

        },

<script>

  var chipsEl = document.getElementById('chips'), itemsEl = document.getElementById('items'), titleEl = document.getElementById('title'), monsEl = document.getElementById('mons');
  var MONS = { red: '#e5383b', orange: '#f4845f', yellow: '#f2c14e', green: '#52b788', blue: '#4a90d9', purple: '#9b72cf', pink: '#ee7fb0', white: '#e8e8e8' };
  var ITEMS = { cup: '☕', plant: '🪴', book: '📚', donut: '🍩', apple: '🍎', tea: '🍵', juice: '🥤', cactus: '🌵', lamp: '💡', phone: '📱', headset: '🎧', pen: '🖊️', clock: '⏰', cookie: '🍪', trophy: '🏆', flower: '🌷' };
  try { var sv = JSON.parse(localStorage.getItem('props') || '{}'); if (typeof sv.mon === 'string' && Object.prototype.hasOwnProperty.call(MONS, sv.mon)) mon = sv.mon; if (Array.isArray(sv.items)) items = sv.items.filter(function (k) { return Object.prototype.hasOwnProperty.call(ITEMS, k); }).slice(0, 4); } catch (e) {}

  try { var s = localStorage.getItem('checkin'); if (s) start = parseInt(s, 10); } catch (e) {}

  try { var savedStatus = localStorage.getItem('workStatus'); if (savedStatus && Object.prototype.hasOwnProperty.call(STAT, savedStatus)) status = savedStatus; stx = (localStorage.getItem('statusText') || '').slice(0, 8); } catch (e) {}
  nickEl.value = nick; titleEl.value = title; document.getElementById('stext').value = stx;

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function drawTimer() {
    var t = Math.max(0, Math.floor((Date.now() - start) / 1000));
    timerEl.textContent = pad(Math.floor(t / 3600)) + ':' + pad(Math.floor(t / 60) % 60) + ':' + pad(t % 60);
  }
  function seat(label, cls, st, dl, ttl, mk, stx) {
    var d = document.createElement('div');
    var known = Object.prototype.hasOwnProperty.call(STAT, st);
    d.className = 'seat' + (cls ? ' ' + cls : '') + (known && STAT[st].p ? ' pause' : '');
    var tt = (typeof ttl === 'string') ? ttl.slice(0, 6) : '';
    var l = document.createElement('span'); l.className = 'lbl' + (tt ? ' two' : '');
    if (tt) { var t1 = document.createElement('div'); t1.className = 'ttl'; t1.textContent = tt; l.appendChild(t1); }
    var n1 = document.createElement('div'); n1.textContent = label; l.appendChild(n1); d.appendChild(l);
    var m = document.createElement('div'); m.className = 'mon'; if (known && STAT[st].e) m.textContent = STAT[st].e;
    if (cls && !(known && STAT[st].p) && typeof mk === 'string' && Object.prototype.hasOwnProperty.call(MONS, mk)) { m.style.background = MONS[mk]; m.style.boxShadow = '0 0 12px ' + MONS[mk]; }
    d.appendChild(m);
    var list = Array.isArray(dl) ? dl : [];
    var sh = document.createElement('div'); sh.className = 'shelf';
    list.slice(0, 4).forEach(function (k) {
      if (typeof k === 'string' && Object.prototype.hasOwnProperty.call(ITEMS, k)) { var s1 = document.createElement('span'); s1.textContent = ITEMS[k]; sh.appendChild(s1); }
    });
    d.appendChild(sh);
    var sd = document.createElement('div'); sd.className = 'stand'; d.appendChild(sd);
    var w = document.createElement('div'); w.className = 'cell';
    w.appendChild(d);
    var cap = document.createElement('div'); cap.className = 'cap';
    if (cls && known && st !== 'work') { cap.textContent = STAT[st].t; }
    w.appendChild(cap);
    var cap2 = document.createElement('div'); cap2.className = 'cap cap2';
    if (cls && typeof stx === 'string' && stx) { cap2.textContent = stx.slice(0, 8); }
    w.appendChild(cap2);
    return w;
  }
  // NPC는 0~2명. 캐릭터마다 개성, 색상, 소품 수, 상태가 모두 다르다.
  var NPCS = [
    {name:'월급루팡',title:'잠복근무',status:'zone',mon:'purple',items:['donut','phone','cup','cookie'],stx:'일하는 척',emoji:'🦥'},

    {name:'야근도깨비',title:'불야근팀',status:'overtime',mon:'red',items:['lamp','cookie','trophy','phone'],stx:'집이 어디',emoji:'👹'},
    {name:'식곤증왕',title:'낮잠연구',status:'sleepy',mon:'yellow',items:['apple'],stx:'눈 감김',emoji:'🐻'},
    {name:'선인장씨',title:'무언팀',status:'work',mon:'white',items:['cactus','plant','flower'],stx:'물 주세요',emoji:'🌵'}
  ];
  var seatNo = Number(localStorage.getItem('seatNo') || 4);
  if (!Number.isInteger(seatNo) || seatNo<1 || seatNo>30) seatNo=2;
  var POSITIONS = ['사장님 왼팔','👑 사장님','사장님 오른팔','기획팀장','기획팀','기획팀','개발팀장','개발팀','개발팀','디자인팀장','디자인팀','디자인팀','운영팀장','운영팀','운영팀','마케팅팀장','마케팅팀','마케팅팀','인사팀장','인사팀','인사팀','재무팀장','재무팀','재무팀','고객지원팀장','고객지원','고객지원','자유석','자유석','자유석'];
  var BOSS = {name:'사장님',title:'대표이사',status:'work',mon:'yellow',items:['trophy','phone','clock','lamp'],stx:'',emoji:'😎'};
  var MOTIONS = {work:{name:'열일',emoji:'👩‍💻'},cheer:{name:'만세',emoji:'🙌'},sleep:{name:'졸기',emoji:'😴'},coffee:{name:'커피',emoji:'☕'},dance:{name:'춤추기',emoji:'🕺'},panic:{name:'멘붕',emoji:'😵'}};
  var motion=localStorage.getItem('myMotion')||'work';if(!MOTIONS[motion])motion='work';
  var motionAt=Number(localStorage.getItem('motionAt')||0);
  var bossLine=localStorage.getItem('bossLine')||'다들 일하고 있는 거 맞죠? 👀';
  var bossTaps=0,bossTapTime=0;
  var mySticker = localStorage.getItem('mySticker') || '';
  var npcSeed = 0;
  function npcRand(n){ var x=Math.sin(n*127.1+npcSeed*13.7)*43758.5453;return x-Math.floor(x); }
  function getNpcs(){
    npcSeed=(floor||1)*97+(roomNo||1)*31;
    var count=Math.floor(npcRand(5)*2), result=[];
    for(var i=0;i<count;i++){
      var ix=Math.floor(npcRand(i+12)*NPCS.length),p=NPCS[ix];
      if(result.some(function(x){return x.name===p.name;})) continue;
      result.push(p);
    }
    return result;
  }
  function decorateAvatar(node, emoji, act, bubble){
    var desk=node.querySelector('.seat');
    var av=document.createElement('span');av.className='avatar '+(MOTIONS[act]?act:'work');av.textContent=emoji||'🙂';
    if(act==='cheer'){var arms=document.createElement('span');arms.className='arms';arms.textContent='🙌';av.appendChild(arms);}
    desk.appendChild(av);
    if(bubble){var sp=document.createElement('span');sp.className='speech';sp.textContent=bubble;desk.appendChild(sp);}
    return av;
  }
  function drawSeats() {
    seatsEl.textContent='';seatsEl.className='seats cols3';
    var slots=Array(30).fill(null),occupied=0;
    slots[1]={kind:'boss',pr:BOSS};
    var active=peers.filter(function(p){return !p.isMe&&p.presence&&p.presence.state==='in';});
    active.sort(function(a,b){return String(a.peer).localeCompare(String(b.peer));});
    active.forEach(function(p){
      var pr=p.presence,desired=Number(pr.seatNo)-1;
      if(!Number.isInteger(desired)||desired<0||desired>=30||desired===1)desired=3;
      for(var j=0;j<29&&slots[desired];j++)desired=(desired+1)%30;
      if(!slots[desired]){slots[desired]={kind:'real',pr:pr};occupied++;}
    });
    if(start){
      var mine=seatNo-1;if(mine<0||mine>=30||mine===1)mine=3;
      for(var k=0;k<29&&slots[mine];k++)mine=(mine+1)%30;
      if(!slots[mine]){slots[mine]={kind:'me'};occupied++;}
    }
    getNpcs().forEach(function(p,i){
      var pos=3+Math.floor(npcRand(i+30)*27);
      for(var j=0;j<29&&slots[pos];j++)pos=(pos+1)%30;
      if(!slots[pos])slots[pos]={kind:'npc',pr:p};
    });
    slots.forEach(function(slot,i){
      var node;
      if(!slot){
        node=seat('빈자리','','',[],POSITIONS[i],null,'');
        var d=node.querySelector('.seat');d.classList.add('empty');d.setAttribute('role','button');d.tabIndex=0;
        node.querySelector('.cap').textContent='＋ 터치해서 착석';
        var select=function(){seatNo=i+1;localStorage.setItem('seatNo',String(seatNo));if(!start){start=Date.now();localStorage.setItem('checkin',String(start));}render();sync();};
        d.onclick=select;d.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();select();}};
      }else if(slot.kind==='me'){
        node=seat(nick||'나','me',status,items,title,mon,stx);
        decorateAvatar(node,motion==='work'?'🙂':MOTIONS[motion].emoji,motion,motion==='sleep'?'Zzz...':motion==='cheer'?'야호!':null);
        node.querySelector('.cap2').textContent=POSITIONS[i];
      }else if(slot.kind==='real'){
        var pr=slot.pr,act=MOTIONS[pr.motion]?pr.motion:'work';
        node=seat((pr.nick||'동료').slice(0,6),'on',pr.status,pr.items,pr.title,pr.mon,pr.stx);
        decorateAvatar(node,act==='work'?'🙂':MOTIONS[act].emoji,act,act==='sleep'?'Zzz...':null);
        node.querySelector('.cap2').textContent=POSITIONS[i];
      }else{
        var p=slot.pr;
        node=seat(p.name,slot.kind==='boss'?'on npc boss':'on npc',p.status,p.items,p.title,p.mon,p.stx);
        var av=decorateAvatar(node,p.emoji,slot.kind==='boss'?'work':p.status==='sleepy'?'sleep':'work',slot.kind==='boss'?bossLine:null);
        if(slot.kind==='boss'){
          av.setAttribute('role','button');av.tabIndex=0;av.title='👑 사장님';
          var tap=function(){var now=Date.now();if(now-bossTapTime>2500)bossTaps=0;bossTapTime=now;bossTaps++;if(bossTaps>=5){bossTaps=0;document.getElementById('bossLine').value=bossLine;document.getElementById('bossModal').hidden=false;}};
          av.onclick=tap;av.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();tap();}};
        }
        node.querySelector('.cap2').textContent=slot.kind==='boss'?'👑 NPC 고정석':POSITIONS[i];
      }
      seatsEl.appendChild(node);
    });
    countEl.textContent='실제 출근 '+occupied+'명 · '+(floor?floor+'층 '+roomNo+'호실 · ':'')+'빈 책상 터치해서 착석';
    document.getElementById('actionMenu').hidden=!start;
    drawStickerWall();
  }
  var actionMenu=document.getElementById('actionMenu');
  Object.keys(MOTIONS).forEach(function(key){
    var b=document.createElement('button');b.textContent=MOTIONS[key].emoji+' '+MOTIONS[key].name;
    b.onclick=function(){motion=key;motionAt=Date.now();localStorage.setItem('myMotion',motion);localStorage.setItem('motionAt',String(motionAt));render();sync();};
    actionMenu.appendChild(b);
  });
  document.getElementById('bossClose').onclick=function(){document.getElementById('bossModal').hidden=true;};
  document.getElementById('bossSave').onclick=function(){
    bossLine=document.getElementById('bossLine').value.trim().slice(0,35)||'다들 일하고 있는 거 맞죠? 👀';
    localStorage.setItem('bossLine',bossLine);document.getElementById('bossModal').hidden=true;drawSeats();
  };
  function drawStickerWall(){
    var wall=document.getElementById('stickerWall');wall.textContent='';
    var all=[];
    if(start&&mySticker)all.push({name:nick||'나',sticker:mySticker});
    peers.forEach(function(p){if(p.isMe||!p.presence||p.presence.state!=='in')return;
      if(['👍','❤️','🔥','☕','🎉','😭','💪','🍀'].indexOf(p.presence.sticker)>=0)all.push({name:p.presence.nick||'동료',sticker:p.presence.sticker});});
    if(!all.length){wall.textContent='아직 남긴 스티커가 없어';wall.style.color='#998888';return;}
    all.forEach(function(p){var d=document.createElement('span');d.style.cssText='background:#392d2d;padding:8px 12px;border-radius:12px;font-size:14px';d.textContent=p.sticker+' '+String(p.name).slice(0,6);wall.appendChild(d);});
  }
  ['👍','❤️','🔥','☕','🎉','😭','💪','🍀'].forEach(function(st){var b=document.createElement('button');b.className='chip';b.textContent=st;b.onclick=function(){if(!start){document.getElementById('stickerInfo').textContent='출근한 다음 남길 수 있어!';return;}mySticker=st;localStorage.setItem('mySticker',st);sync();drawStickerWall();document.getElementById('stickerInfo').textContent='스티커를 남겼어!';};document.getElementById('stickerButtons').appendChild(b);});
  function sync() {
    try { localStorage.setItem('props', JSON.stringify({ items: items, mon: mon })); localStorage.setItem('workStatus', status); localStorage.setItem('statusText', stx); } catch (e) {}
    if (room) room.presence({ state: start ? 'in' : 'out', nick: nick, status: status, items: items, title: title, mon: mon, stx: stx, seatNo: seatNo, sticker: mySticker, motion: motion, motionAt: motionAt });
  }
  function drawChips() {
    chipsEl.textContent = '';
    function chip(text, sel, fn) {
      var b = document.createElement('button');
      b.className = 'chip' + (sel ? ' sel' : ''); b.textContent = text;
      b.addEventListener('click', function () { fn(); render(); sync(); });
      chipsEl.appendChild(b);
    }
    if (start) {
      Object.keys(STAT).forEach(function (k) {
        chip((STAT[k].e ? STAT[k].e + ' ' : '') + STAT[k].t, status === k, function () { status = k; });
      });
    }
    monsEl.textContent = '';
    Object.keys(MONS).forEach(function (k) {
      var sw = document.createElement('button');
      sw.className = 'swatch' + (mon === k ? ' sel' : ''); sw.style.background = MONS[k]; sw.setAttribute('aria-label', k);
      sw.addEventListener('click', function () { mon = k; render(); sync(); });
      monsEl.appendChild(sw);
    });
    itemsEl.textContent = '';
    Object.keys(ITEMS).forEach(function (k) {
      var b = document.createElement('button');
      b.className = 'chip' + (items.indexOf(k) >= 0 ? ' sel' : ''); b.textContent = ITEMS[k];
      b.addEventListener('click', function () {
        var i = items.indexOf(k);
        if (i >= 0) items.splice(i, 1); else if (items.length < 4) items.push(k);
        render(); sync();
      });
      itemsEl.appendChild(b);
    });
  }
  function render() {
    drawChips();
    if (start) {
      statusEl.textContent = (STAT[status] ? STAT[status].t : '근무 중') + (stx ? ' · ' + stx : '');
      btn.textContent = '퇴근하기'; btn.className = 'out';
      drawTimer(); if (!iv) iv = setInterval(drawTimer, 1000);
    } else {
      statusEl.textContent = '아직 출근 전이에요';
      btn.textContent = '출근하기'; btn.className = '';
      timerEl.textContent = '00:00:00';
      if (iv) { clearInterval(iv); iv = null; }
    }
    Array.prototype.forEach.call(actionMenu.children,function(b,i){b.classList.toggle('sel',Object.keys(MOTIONS)[i]===motion);});
    drawSeats();
  }
  btn.addEventListener('click', function () {
    if (start) { start = null; try { localStorage.removeItem('checkin'); } catch (e) {} }
    else { start = Date.now(); try { localStorage.setItem('checkin', String(start)); } catch (e) {} }
    render(); sync();
  });
  titleEl.addEventListener('change', function () {
    title = titleEl.value.trim();
    try { localStorage.setItem('title', title); } catch (e) {}
    render(); sync();
  });
  nickEl.addEventListener('change', function () {
    nick = nickEl.value.trim();
    try { localStorage.setItem('nick', nick); } catch (e) {}
    render(); sync();
  });
  // 초기 화면은 모든 설정값을 읽은 뒤 렌더링한다.

  var MAXROOM = 29, ROOMS = 5, MAXFLOOR = 20;
  var floor = 0, roomNo = 0, lobbyRef = null, busy = false;
  var roomsEl = document.getElementById('rooms');
  var stxEl = document.getElementById('stext');
  stxEl.value = stx;
  stxEl.addEventListener('input', function () { stx = stxEl.value.trim().slice(0, 8); render(); sync(); });
  var decoBtn = document.getElementById('decoBtn'), decoEl = document.getElementById('deco');
  decoBtn.addEventListener('click', function () {
    var wasHidden = decoEl.hidden;
    decoEl.hidden = !wasHidden;
    decoBtn.textContent = wasHidden ? '꾸미기 ▴' : '꾸미기 ▾';
  });
  function roomName(f, r) { return 'f' + f + '-r' + r; }
  function noteText() { return floor + '층 ' + roomNo + '호실 · 방당 최대 ' + MAXROOM + '명 (한 층 ' + (MAXROOM * ROOMS) + '명)'; }
  function drawRooms() {
    roomsEl.textContent = '';
    if (!floor) return;
    for (var i = 1; i <= ROOMS; i++) {
      (function (k) {
        var b = document.createElement('button');
        b.className = 'chip' + (k === roomNo ? ' sel' : ''); b.textContent = k + '호실';
        b.addEventListener('click', function () { switchTo(k); });
        roomsEl.appendChild(b);
      })(i);
    }
  }
  function tryJoin(lobby, f, r, cb) {
    lobby.join(roomName(f, r)).then(function (nr) {
      nr.presence({ state: 'out' });
      setTimeout(function () {
        if (nr.peers().filter(function(p){return p.presence&&p.presence.state==='in';}).length > MAXROOM) {
          var done = function () { cb(null); };
          nr.leave().then(done, done);
        } else { cb(nr); }
      }, 1500);
    }, function () { cb(undefined); });
  }
  function attach(nr, f, r) {
    var old = room;
    room = nr; floor = f; roomNo = r;
    peers = nr.peers();
    nr.onPeers(function (ch) { peers = ch.peers; drawSeats(); });
    if (old && old !== lobbyRef && old !== nr && typeof old.leave === 'function') old.leave();
    sync(); drawSeats(); drawRooms();
    noteEl.textContent = noteText();
  }
  function fallback(lobby) {
    room = lobby;
    lobby.onPeers(function (ch) { peers = ch.peers; drawSeats(); });
    sync();
    noteEl.textContent = '말없이 같이 일하는 공간이에요. 이 링크를 연 사람들이 서로 보여요.';
  }
  function autoJoin(lobby, f, r) {
    if (f > MAXFLOOR) { noteEl.textContent = '모든 층이 가득 찼어요. 나중에 다시 와주세요.'; return; }
    tryJoin(lobby, f, r, function (nr) {
      if (nr) { attach(nr, f, r); return; }
      if (nr === undefined) { fallback(lobby); return; }
      if (r < ROOMS) autoJoin(lobby, f, r + 1); else autoJoin(lobby, f + 1, 1);
    });
  }
  function switchTo(r) {
    if (!lobbyRef || busy || !floor || r === roomNo) return;
    busy = true; noteEl.textContent = r + '호실로 이동 중…';
    tryJoin(lobbyRef, floor, r, function (nr) {
      busy = false;
      if (nr) { attach(nr, floor, r); return; }
      noteEl.textContent = nr === null ? r + '호실은 가득 찼어요 (최대 ' + MAXROOM + '명)' : r + '호실에 들어가지 못했어요';
      setTimeout(function () { noteEl.textContent = noteText(); }, 2500);
    });
  }
  render();
  if (window.claude && window.claude.use) {
    window.claude.use('room').then(function (r) {
      if (!r) { noteEl.textContent = '지금은 혼자 보는 화면이에요. 링크를 연 다른 사람은 연결되지 않아요.'; return; }
      lobbyRef = r; autoJoin(r, 1, 1);
      sync();
      
      noteEl.textContent = '방을 찾는 중이에요…';
    }).catch(function () {});
  }
</script>
</body>
</html>
